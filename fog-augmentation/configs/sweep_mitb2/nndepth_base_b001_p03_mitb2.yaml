model:
  mmseg_config: configs/_base_/deeplabv3plus_r101.py
  checkpoint: results/checkpoints/pretrained/deeplabv3plus_r101_cityscapes.pth
  num_classes: 19
  encoder_name: mit_b2
  architecture: fpn
data:
  cityscapes_root: /home/taah3149/Documents/Group_Studies/dataset/cityscapes
  acdc_root: /home/taah3149/Documents/Group_Studies/dataset/acdc
  img_size:
  - 2048
  - 1024
  crop_size:
  - 1024
  - 512
  scale_range:
  - 0.5
  - 2.0
  batch_size: 4
  num_workers: 4
  use_fog_cache: true
training:
  epochs: 50
  lr: 6.0e-05
  weight_decay: 0.01
  poly_power: 1.0
  val_interval: 5
  log_interval: 50
  resume: null
  output_dir: results/nndepth_base_b001_p03_mitb2
evaluate:
  split: val
experiment:
  name: nndepth_base_b001_p03_mitb2
  seed: 42
  description: 'NN-depth (Base) beta=0.01, fog_prob=0.3 [backbone: mit_b2/FPN]'
augmentation:
  type: nn_depth
  beta: 0.01
  model_id: depth-anything/Depth-Anything-V2-Metric-Outdoor-Base-hf
  fog_prob: 0.3
