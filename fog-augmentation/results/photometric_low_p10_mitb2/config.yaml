augmentation:
  fog_prob: 0.1
  intensity: low
  type: photometric
data:
  acdc_root: /home/taah3149/Documents/Group_Studies/dataset/acdc
  batch_size: 4
  cityscapes_root: /home/taah3149/Documents/Group_Studies/dataset/cityscapes
  crop_size:
  - 1024
  - 512
  img_size:
  - 2048
  - 1024
  num_workers: 4
  scale_range:
  - 0.5
  - 2.0
  use_fog_cache: false
evaluate:
  split: val
experiment:
  description: 'Photometric low, fog_prob=0.1 (10% of training images fogged) [backbone:
    mit_b2/FPN]'
  name: photometric_low_p10_mitb2
  seed: 42
model:
  architecture: fpn
  checkpoint: results/checkpoints/pretrained/deeplabv3plus_r101_cityscapes.pth
  encoder_name: mit_b2
  mmseg_config: configs/_base_/deeplabv3plus_r101.py
  num_classes: 19
training:
  epochs: 50
  log_interval: 50
  lr: 6.0e-05
  output_dir: results/photometric_low_p10_mitb2
  poly_power: 1.0
  resume: null
  val_interval: 5
  weight_decay: 0.01
